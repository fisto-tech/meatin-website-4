<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 490" width="100%" height="100%">
  <defs>
    <style>
      @keyframes waveGoodFoodStamp {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-5px) rotate(-1.5deg);
        }
      }
      @keyframes drawCornerLine {
        0% {
          stroke-dashoffset: 160;
        }
        50% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -160;
        }
      }
      .animated-good-food {
        animation: waveGoodFoodStamp 4s ease-in-out infinite;
        transform-origin: center center;
      }
      .corner-line {
        stroke-dasharray: 6, 4;
        animation: drawCornerLine 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="380" height="490" rx="20" ry="20" fill="#F8F8F8" />

  <!-- Top-Left Corner Dotted Frame -->
  <path class="corner-line" d="M 27 114 V 27 H 117" fill="none" stroke="#79C037" stroke-width="2" stroke-linecap="round" />
  <path d="M 23 114 H 31 M 117 23 V 31" stroke="#79C037" stroke-width="2" stroke-linecap="round" />

  <!-- Header Text: MEET OUR TEAM -->
  <text x="36" y="60" fill="#79C037" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.5">MEET</text>
  <text x="36" y="100" fill="#0F3923" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.5">OUR TEAM</text>

  <!-- Subtitle: The People Behind Freshness -->
  <text x="36" y="138" fill="#222222" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20">The People Behind Freshness</text>

  <!-- Description Paragraph -->
  <text x="36" y="166" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14">Passionate professional working together</text>
  <text x="36" y="186" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14">to bring quality and care to your table.</text>

  <!-- Badge / Shield Section -->
  <g transform="translate(36, 208)">
    <!-- Shield Icon background -->
    <path d="M12 0 C 20 0 24 4 24 10 C 24 20 12 28 12 28 C 12 28 0 20 0 10 C 0 4 4 0 12 0 Z" fill="#79C037"/>
    <!-- Star Inside Shield -->
    <polygon points="12,5 13.8,9.5 18.5,9.8 14.9,12.8 16,17.4 12,14.9 8,17.4 9.1,12.8 5.5,9.8 10.2,9.5" fill="#FFFFFF"/>
    <!-- Badge Title -->
    <text x="34" y="11" fill="#111111" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">One Team. One Purpose.</text>
    <!-- Badge Subtitle -->
    <text x="34" y="25" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">Better Chicken. Better Lives.</text>
  </g>

  <!-- Top Right Replaced Image (meat-images.webp) -->
  <g class="animated-good-food">
    <image href="/MeetOurTeam/banner/meat-images.webp" xlink:href="/MeetOurTeam/banner/meat-images.webp" x="220" y="20" width="140" height="95" preserveAspectRatio="xMidYMid meet" />
  </g>

  <!-- Bottom Wave Graphics & Circles -->
  <!-- Translucent Circle Behind Wave -->
  <circle cx="190" cy="360" r="105" fill="#79C037" fill-opacity="0.18" />
  <circle cx="190" cy="360" r="95" fill="none" stroke="#79C037" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.5" />

  <!-- Dark Green Background Wave -->
  <path d="M0 290 Q 90 265 190 280 T 380 270 V 490 H 0 Z" fill="#35591B" />

  <!-- Foreground Bright Green Wave -->
  <path d="M0 325 Q 110 300 190 320 T 380 295 V 490 H 0 Z" fill="#79C037" />
</svg>
